<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Celoris Studio - GTA Style Logo Intro</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Bebas+Neue&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
        font-family: 'Montserrat', sans-serif;
        user-select: none;
      }

      /* Viewport Stage */
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(circle at 50% 50%, #0d1117 0%, #05070a 60%, #000000 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* CRT Scanline & Grain Texture */
      .scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.02) 0px,
          rgba(255, 255, 255, 0.02) 1px,
          transparent 1px,
          transparent 3px
        );
        pointer-events: none;
        z-index: 15;
        mix-blend-mode: overlay;
      }

      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.85) 90%, #000000 100%);
        pointer-events: none;
        z-index: 10;
      }

      /* Logo Assembly */
      #logo-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 60;
        transform-origin: center center;
        will-change: transform, opacity;
      }

      /* Rockstar GTA Outer Badge */
      .badge-outer {
        position: relative;
        width: 220px;
        height: 220px;
        background: #090a0f;
        border: 7px solid #ffffff;
        border-radius: 46px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 
          0 0 0 2px rgba(0, 0, 0, 0.8),
          0 0 45px rgba(255, 255, 255, 0.25),
          inset 0 0 30px rgba(0, 0, 0, 0.9);
        overflow: hidden;
      }

      /* Specular Light Sweep */
      .shine-bar {
        position: absolute;
        top: -150%;
        left: -150%;
        width: 300%;
        height: 300%;
        background: linear-gradient(
          115deg,
          transparent 40%,
          rgba(255, 255, 255, 0.4) 48%,
          rgba(255, 255, 255, 0.8) 50%,
          rgba(255, 255, 255, 0.4) 52%,
          transparent 60%
        );
        transform: rotate(25deg);
        pointer-events: none;
      }

      /* SVG Icon (The Celoris Sprout/Wing) */
      .logo-icon {
        width: 105px;
        height: 75px;
        margin-top: -8px;
        margin-bottom: 2px;
        filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
      }

      /* 'celoris' Brandmark */
      .logo-text {
        font-family: 'Montserrat', sans-serif;
        font-size: 38px;
        font-weight: 900;
        font-style: italic;
        letter-spacing: -0.06em;
        color: #ffffff;
        text-transform: lowercase;
        line-height: 1;
        text-shadow: 0 4px 15px rgba(0,0,0,0.9);
      }

      /* GTA Sub-Text: STUDIO */
      .sub-badge {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .studio-title {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 46px;
        color: #ffffff;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        text-shadow: 
          0 0 20px rgba(255, 255, 255, 0.4),
          0 4px 12px rgba(0, 0, 0, 0.9);
        padding-left: 0.35em; /* compensate tracking */
      }

      .gta-tagline {
        font-family: 'Montserrat', sans-serif;
        font-size: 13px;
        font-weight: 900;
        color: #ff9900; /* GTA Vinewood Gold */
        letter-spacing: 0.3em;
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(255, 153, 0, 0.6);
        padding-left: 0.3em;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .gta-star {
        color: #ff9900;
        font-size: 14px;
        filter: drop-shadow(0 0 6px #ff9900);
      }

      /* Explosive Flash Burst */
      #impact-flash {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(255,255,255,0.95) 0%, rgba(255, 200, 100, 0.6) 25%, transparent 70%);
        pointer-events: none;
        z-index: 35;
        opacity: 0;
        mix-blend-mode: screen;
      }

      /* Chromatic Aberration RGB Glitch Elements */
      .glitch-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 30;
        mix-blend-mode: screen;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="main"
      data-start="0"
      data-duration="3.0"
      data-width="1920"
      data-height="1080"
    >
      <!-- Atmospheric Overlays -->
      <div class="scanlines"></div>
      <div class="vignette"></div>
      <div id="impact-flash"></div>

      <!-- Main Logo Assembly -->
      <div id="logo-container">
        <!-- Rounded Badge -->
        <div class="badge-outer">
          <div class="shine-bar" id="shine" data-layout-allow-overflow></div>
          
          <!-- Leaf / Tech Sprout Icon -->
          <svg class="logo-icon" viewBox="0 0 54 54" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M42 22C42 22 31 11 16 17C9 20 5 27 7 35C9 43 18 47 28 45C39 43 45 32 42 22Z" fill="#FFFFFF"/>
            <path d="M40 24C40 24 29 15 18 20C12 22 9 29 11 37C13 45 22 47 31 45C40 43 43 32 40 24Z" fill="#E2E8F0"/>
            <path d="M42 22C41 30 39 41 39 51" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
          </svg>

          <!-- Celoris Text -->
          <div class="logo-text">celoris</div>
        </div>

        <!-- GTA Style Sub-Badge -->
        <div class="sub-badge" id="sub-badge">
          <div class="studio-title" id="studio-title">STUDIO</div>
          <div class="gta-tagline" id="gta-tagline">
            <span class="gta-star">★</span>
            <span>SAN ANDREAS</span>
            <span class="gta-star">★</span>
          </div>
        </div>
      </div>
    </div>

    <!-- GSAP Cinematic Timeline -->
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Initial State
      gsap.set("#logo-container", { scale: 2.4, opacity: 0 });
      gsap.set(".badge-outer", { boxShadow: "0 0 80px rgba(255, 153, 0, 0.8), 0 0 0 3px #ff9900" });
      gsap.set("#studio-title", { scale: 1.4, opacity: 0, y: -5 });
      gsap.set("#gta-tagline", { opacity: 0, y: 15 });
      gsap.set("#shine", { x: -300, y: -300 });

      // 0.00s - 0.25s: Black screen suspense
      // 0.25s: The Violent Impact Slam (Rockstar Games style slam)
      tl.to("#logo-container", {
        opacity: 1,
        scale: 1.0,
        duration: 0.32,
        ease: "power4.out"
      }, 0.25);

      // Flash on impact
      tl.fromTo("#impact-flash", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.out" }, 0.25);

      // Camera Recoil / Screen Shake
      tl.to("#stage", { x: -7, y: 6, duration: 0.04, yoyo: true, repeat: 4, ease: "rough" }, 0.25);
      tl.to("#stage", { x: 0, y: 0, duration: 0.05 }, 0.45);

      // Border shifts from GTA Gold to Crisp White
      tl.to(".badge-outer", {
        borderColor: "#ffffff",
        boxShadow: "0 0 0 2px rgba(0,0,0,0.8), 0 0 50px rgba(255,255,255,0.35), inset 0 0 25px rgba(0,0,0,0.8)",
        duration: 0.55,
        ease: "power2.out"
      }, 0.32);

      // Sub-titles Slam & Settle
      tl.to("#studio-title", {
        opacity: 1,
        scale: 1.0,
        y: 0,
        duration: 0.4,
        ease: "back.out(1.6)"
      }, 0.38);

      tl.to("#gta-tagline", {
        opacity: 1,
        y: 0,
        duration: 0.35,
        ease: "power3.out"
      }, 0.52);

      // Specular Shine Sweep across the badge
      tl.to("#shine", {
        x: 600,
        y: 600,
        duration: 0.85,
        ease: "power2.inOut"
      }, 0.60);

      // Slow Cinematic Hero Push-In (0.6s to 2.2s)
      tl.to("#logo-container", {
        scale: 1.07,
        duration: 1.6,
        ease: "none"
      }, 0.60);

      // 2.20s - 2.45s: Gritty CRT Flicker
      tl.to("#logo-container", {
        opacity: 0.2,
        duration: 0.05,
        repeat: 3,
        yoyo: true,
        ease: "steps(2)"
      }, 2.20);

      // 2.48s - 2.85s: Hard Fade to Black
      tl.to("#logo-container", {
        opacity: 0,
        scale: 1.12,
        duration: 0.35,
        ease: "power3.in"
      }, 2.48);

      // Register with HyperFrames
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
